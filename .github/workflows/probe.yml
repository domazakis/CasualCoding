name: probe-aggelies
on:
  workflow_dispatch:
  push:
    branches: [aggelies-probe]
    paths: ["probe.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python probe.py
      - name: Αποθήκευση αποτελεσμάτων
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "Αποτελέσματα δοκιμής $(date -u +%F_%H%M)" || echo "τίποτα νέο"
          git push
